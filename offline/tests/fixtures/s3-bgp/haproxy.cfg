# excerpt of a cephadm ingress haproxy.cfg (test fixture; credentials are fake)
global
    log 127.0.0.1 local2
frontend stats
    mode http
    bind 10.0.0.50:1968
    bind 10.0.0.42:1968
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:FAKE-SECRET-123
    http-request use-service prometheus-exporter if { path /metrics }
    monitor-uri /health
frontend frontend
    bind 10.0.0.50:80
    default_backend backend
backend backend
    option forwardfor
    balance static-rr
    option httpchk HEAD / HTTP/1.0
    server rgw.main.node2.abcdef 10.0.0.42:8080 check weight 100 inter 2s
    server rgw.main.node3.ghijkl 10.0.0.43:8080 check weight 100 inter 2s
